services:
  portal-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - portal-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Loopback only — permite "dotnet run" no host (fora do compose) alcançar localhost:3306
      # em dev. Em produção o portal-api já acessa via rede interna do compose (nome do serviço);
      # essa porta em loopback não é usada lá, mas expô-la não amplia o risco (só same-machine).
      - "127.0.0.1:3306:3306"
    networks:
      # default: rede implícita deste compose, onde o portal-api já fala com este container.
      # beautyhairapp_shared: reaproveitado pelo beautyhairapp-api (banco próprio dentro deste
      # mesmo container MySQL, decisão de 14/09/2026 — ver saas/beautyhairapp/PRODUCT.md) — rede
      # dedicada só pra isso, em vez de expor o MySQL na n8n_default (que teria n8n/claw3d/
      # openclaw como vizinhos sem necessidade de falar com o banco).
      - default
      - beautyhairapp_shared

  portal-api:
    build: .
    container_name: portal-api
    restart: unless-stopped
    depends_on:
      portal-mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PortalDb: "Server=portal-mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      Storage__ArtefatosRoot: /app/storage/artefatos
      Storage__UploadsRoot: /app/storage/uploads
      Storage__DownloadTokenSecret: ${DOWNLOAD_TOKEN_SECRET}
      # Link de login do portal do cliente: endereço público do site, usado no e-mail enviado pelo Resend.
      ClienteLogin__PortalBaseUrl: https://www.nelson-proenca-info.com.br
      Resend__ApiKey: ${RESEND_API_KEY}
      # n8n do site: o portal-api avisa os webhooks (rede n8n_default) e o n8n devolve o resultado por
      # callback com o mesmo segredo (header X-Webhook-Secret). Sem o segredo, avisos e callbacks ficam desligados.
      N8n__BaseUrl: http://n8n:5678
      N8n__WebhookSecret: ${N8N_WEBHOOK_SECRET:-}
    volumes:
      - portal-artefatos-data:/app/storage/artefatos
      - portal-uploads-data:/app/storage/uploads
    networks:
      - default
      - n8n_default
    ports:
      # Loopback — só pra debug direto na VPS (curl/exec). O Caddy roda em
      # container na rede n8n_default e alcança este serviço por nome
      # (portal-api:8080), não por essa porta publicada.
      - "127.0.0.1:5299:8080"

networks:
  n8n_default:
    external: true
  # Declarada (não external) aqui — este compose é o "dono" dela. O compose do
  # beautyhairapp-api referencia como external:true; precisa que este suba primeiro.
  beautyhairapp_shared:
    name: beautyhairapp_shared

volumes:
  portal-mysql-data:
  portal-artefatos-data:
  portal-uploads-data:
